# Mouse support - scroll, select, resize panes
set -g mouse on

# Large scrollback - this is where output from long-running remote work lives
set -g history-limit 50000

# True color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Vi-style copy mode, matches EDITOR=vim
setw -g mode-keys vi

# Renumber windows when one is closed
set -g renumber-windows on

# Start windows/panes at 1, not 0 - easier to reach on keyboard
set -g base-index 1
setw -g pane-base-index 1

# Show hostname in the status bar, so it's obvious which machine a session
# belongs to when hopping between this one and others
set -g status-right "#[fg=colour245]#h"

# Faster escape time - avoids lag entering vi command mode in vim
set -sg escape-time 10

# Reload config without restarting the session
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
